<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>없는 페이지입니다 — 법률 절차 길잡이</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#020817" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fff;--fg:#020817;--muted:#64748b;--line:#e2e8f0;--soft:#f8fafc;--brand:#3182f6;--brand-d:#1b64da}
@media (prefers-color-scheme:dark){
  :root{--bg:#020817;--fg:#f8fafc;--muted:#94a3b8;--line:#1e293b;--soft:#0f172a;--brand:#54a2ff;--brand-d:#3080ff}
}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  background:var(--bg);color:var(--fg);letter-spacing:-.015em;word-break:keep-all;
  min-height:100vh;display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}
.box{max-width:460px;text-align:center}
.mk{width:52px;height:52px;border-radius:14px;background:var(--brand);display:grid;place-items:center;margin:0 auto 24px}
.mk svg{width:30px;height:30px}
h1{font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.35}
p{color:var(--muted);font-size:15.5px;line-height:1.7;margin-top:14px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}
a.btn{display:inline-flex;align-items:center;height:48px;padding:0 20px;border-radius:10px;
  font-size:15.5px;font-weight:700;text-decoration:none;border:1px solid transparent}
a.primary{background:var(--brand);color:#fff}
a.primary:hover{background:var(--brand-d)}
a.ghost{border-color:var(--line);color:var(--fg)}
a.ghost:hover{background:var(--soft)}
.tel{margin-top:26px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="box">
  <div class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M7 20h10M5 8h14"/><path d="M5 8 2.5 13.5h5zM19 8l-2.5 5.5h5z"/></svg></div>
  <h1>찾으시는 페이지가 없습니다</h1>
  <p>주소가 바뀌었거나 지워진 페이지예요.<br>필요한 서식은 아래에서 검색해 보세요.</p>
  <div class="row">
    <a class="btn primary" href="/#forms">서식 찾기</a>
    <a class="btn ghost" href="/">처음으로</a>
  </div>
  <p class="tel">급하시면 무료 법률상담 국번없이 <b>132</b> · 노동 <b>1350</b> · 여성긴급 <b>1366</b></p>
</div>
</body>
</html>
