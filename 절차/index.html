const 부호RE = new RegExp("(\\d{2,4})\\s*("+부호목록.join("|")+")\\s*제?\\s*(\\d{1,7})\\s*호?");
function 번호읽기(text){
  let s = String(text).normalize("NFKC").trim()
    .replace(/[·\-–—_/.]+/g," ")
    .replace(/\S*(?:법원|지원|검찰청|지청)\s*/g,"")
    .replace(/\s+/g," ").trim();
  if(!s) return {ok:false, 안내:"사건번호를 입력해 주세요."};
  if(/^\d{4}\s+\d{4,8}$/.test(s))
    return {ok:false, 안내:"경찰 접수번호로 보입니다. 이 번호만으로는 지금 어느 단계인지 알 수 없어요. 질문으로 찾아볼까요?"};
  const m = s.match(부호RE);
  if(!m) return {ok:false, 안내:"사건번호를 읽지 못했습니다. 2026고단1234 처럼 적어 주세요."};
  const 부호=m[2]; let 연도=+m[1]; if(연도<100) 연도+=2000;
  if(D.비형사[부호])
    return {ok:false, 안내:`이건 형사사건 번호가 아니라 ${D.비형사[부호]} 사건 번호로 보입니다. 이 도구는 형사절차만 다룹니다.`};
  const v = D.부호표[부호];
  const r = {ok:true, 부호, 연도, 번호:+m[3], 기관:v.기관, 쉬운말:v.쉬운말,
             진입노드:v.진입노드, 주의:v.주의, 알림:v.알림};
  if(!v.진입노드){ r.ok=false; r.안내=`${v.쉬운말}이네요. 이 번호만으로는 지금 무엇을 해야 하는지까지는 알 수 없어요. 질문으로 찾아볼까요?`; }
  if(new Date().getFullYear()-연도>=2){
    r.오래됨="이미 기한이 지났을 수 있어요. 다만 내 잘못이 아닌 사정으로 놓친 경우라면 아직 길이 있습니다.";
  }
  return r;
}

function 이동(id){ stack.push(현재id); 현재id=id; 그리기(D.노드[id]); }
let 현재id=null;

function 그리기(node, 루트){
  if(루트){ 현재id="ROOT"; }
  crumb.textContent = stack.length ? "질문 "+(stack.length)+"번째" : "";
  const t=node.type;
  if(t==="question"||t==="checklist_question") 그리기_질문(node);
  else if(t==="date") 그리기_날짜(node);
  else 그리기_잎(node);
  window.scrollTo(0,0);
}

function 그리기_날짜(n){
  if(!검수통과(현재id)){검수보류(n);return;}
  const 규칙=D.기한규칙[n.rule];
  // 사진 흐름에서 이미 받은 날짜라면 다시 묻지 않는다. 같은 걸 두 번 묻는 건 실례다.
  if(담은날짜[n.field]){
    const {날짜}=마감계산(담은날짜[n.field],규칙);
    const 다음 = 일수차(날짜,오늘())>=0 ? n.if_open : n.if_expired;
    현재id = 다음;                    // 건너뛴 것이므로 스택에 쌓지 않는다
    그리기(D.노드[다음]);
    return;
  }
  app.innerHTML = `
    <p class="q">${esc(n.ask)}</p>
    <p class="note">며칠 남았는지는 저희가 세겠습니다.</p>
    <div class="datebox">
      <label for="dt">날짜</label>
      <input type="date" id="dt">
      <button class="go" id="dtgo">확인</button>
    </div>
    ${n.none_option?`<ul class="opts" style="margin-top:.65rem"><li><button class="opt" id="none">${esc(n.none_option.label)}<span class="arw">→</span></button></li></ul>`:""}
    ${nav()}`;
  const inp=$("#dt");
  inp.max = 날짜문자(new Date());
  $("#dtgo").onclick=()=>{
    if(!유효날짜(inp.value)){ inp.focus(); inp.reportValidity(); return; }
    담은날짜[n.field]=inp.value;
    const {날짜}=마감계산(inp.value,규칙);
    const 남음=일수차(날짜,오늘());
    이동(남음>=0 ? n.if_open : n.if_expired);
  };
  if(n.none_option) $("#none").onclick=()=>이동(n.none_option.next);
  붙이기_nav();
}

function 그리기_잎(n){
  if(!검수통과(현재id)){검수보류(n);return;}
  const 규칙 = n.rule ? D.기한규칙[n.rule] : null;
  let dlHTML="", 물어야할필드=null;
  if(규칙){
    // 그 규칙이 요구하는 바로 그 날짜만 쓴다.
    // 예전엔 없으면 아무 날짜나 갖다 썼는데, 상소권회복(사유해소일 기준)에
    // 판결선고일을 넣어 "76일 지났습니다"라고 하는 사고가 났다.
    // 아직 길이 열린 사람을 포기시키는 오답이라 fallback을 없앴다.
    const 시작 = 담은날짜[규칙.from];
    if(시작){
      const {날짜,밀림}=마감계산(시작,규칙);
      const 남음=일수차(날짜,오늘());
      const 지남=남음<0;
      dlHTML=`<div class="dl ${지남?"over":""}">
        <div class="big">${지남?`${-남음}일 지났습니다`:(남음===0?"오늘이 마지막 날":`${남음}일 남았습니다`)}</div>
        <div class="day">${한글날짜(날짜)}까지</div>
        <div class="where">어디에 — ${esc(규칙.제출처)}</div>
        <div class="caveat">첫날은 세지 않습니다(형사소송법 66조 1항).${밀림?" 마지막 날이 쉬는 날이라 다음 평일로 밀렸습니다.":""}
        설·추석처럼 해마다 날짜가 바뀌는 공휴일은 계산에 넣지 못했습니다. <b>마지막 날에 기대지 말고 미리 내세요.</b></div>
      </div>`;
    } else {
      // 날짜를 아직 모른다 — 지어내지 말고 그 자리에서 묻는다
      dlHTML=`<div class="dl">
        <div class="day">기한은 ${규칙.days}일입니다</div>
        <div class="where">어디에 — ${esc(규칙.제출처)}</div>
        <div class="datebox" style="margin-top:.9rem;padding:1rem">
          <label for="lfdt">${esc(규칙.물음||"")}</label>
          <input type="date" id="lfdt">
          <button class="go" id="lfgo">며칠 남았는지 보기</button>
        </div>
      </div>`;
      물어야할필드 = 규칙.from;
    }
  } else if(n.기한){
    dlHTML=`<div class="dl"><div class="day">기한 ${esc(n.기한)}</div></div>`;
  }
  const 먼저 = n.먼저확인;
  app.innerHTML = `
    <div class="leaf lf-${esc(n.state)}">
      <h2>${esc(n.title)}</h2>
      <p class="sub">${esc(D.잎상태[n.state].뜻)}</p>
      ${dlHTML}
      ${먼저?`<div class="warn good"><b>${esc(먼저.조건)}</b><br>${esc(먼저.경로)} — ${esc(먼저.근거)}</div>`:""}
      ${n.steps?`<ul class="steps">${n.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:""}
      ${n.대안?`<ul class="steps">${n.대안.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:""}
      ${n.warning?`<div class="warn"><b>꼭 알아두세요</b> ${esc(n.warning)}</div>`:""}
      ${n.솔직하게?`<div class="honest">${esc(n.솔직하게)}</div>`:""}
      ${n.statutes?`<p class="cites">${n.statutes.map(esc).join(" · ")}</p>`:""}
    </div>
    ${nav()}`;
  if(물어야할필드){
    const i=$("#lfdt"); i.max=날짜문자(new Date());
    $("#lfgo").onclick=()=>{ if(!유효날짜(i.value)){i.focus();i.reportValidity();return;} 담은날짜[물어야할필드]=i.value; 그리기_잎(n); };
  }
  붙이기_nav();
}

        progress:text=>{if(generation===읽기세대)status.textContent=text;},
        ocr:async canvas=>{
          if(controller.signal.aborted)throw Error('읽기 취소');
          if(!worker){

            worker=await Tesseract.createWorker('kor',1,{workerPath:local('ocr/worker.min.js'),corePath:local('ocr/tesseract-core-simd.wasm.js'),langPath:local('ocr')});
            if(controller.signal.aborted){await worker.terminate();throw Error('읽기 취소');}
            활성OCR=worker;
          }
          return (await worker.recognize(canvas)).data.text||'';
        }});
      if(generation!==읽기세대 || controller.signal.aborted)return;
      판독확인(판독(result.text));
    }catch(error){

      input.disabled=false; input.value=''; cancel.hidden=true;
    }finally{clearTimeout(timer); if(worker)await worker.terminate().catch(()=>{}); if(활성OCR===worker)활성OCR=null; if(pdf취소===controller)pdf취소=null;}

}

let 취소됨=false;

async function OCR돌리기(){
  const 세대=++읽기세대, 대상URL=사진URL;
  let worker;
  const ptxt=()=>$("#ptxt"), pbar=()=>$("#pbar");
  try{
    if(typeof Tesseract==="undefined") throw new Error("엔진 없음");
    // 워커 안에서는 상대경로가 풀리지 않는다. 절대 주소로 준다.
    const 여기 = (p)=>new URL(p, location.href).href;
    worker = await Tesseract.createWorker("kor", 1, {
      workerPath: 여기("ocr/worker.min.js"),
      corePath:   여기("ocr/tesseract-core-simd.wasm.js"),
      langPath:   여기("ocr"),
      logger:(m)=>{
        if(취소됨 || 세대!==읽기세대) return;
        const t=ptxt(), b=pbar(); if(!t||!b) return;
        if(m.status==="recognizing text"){ t.textContent="글자를 찾는 중…"; b.style.width=Math.round(m.progress*100)+"%"; }
        else { t.textContent="사전을 준비하는 중…"; }
      },
    });
    if(세대===읽기세대) 활성OCR=worker;
    if(취소됨 || 세대!==읽기세대) return;
    const {data} = await worker.recognize(대상URL);
    if(취소됨 || 세대!==읽기세대) return;
    판독확인(판독(data.text||""));
  }catch(e){
    if(취소됨 || 세대!==읽기세대) return;
    // 못 읽었으면 추측하지 않는다. 솔직히 말하고 직접 고르게 한다.
    판독확인({실패:true, 사유: String(e.message||e).includes("엔진")
      ? "글자 읽는 기능을 불러오지 못했습니다."
      : "사진에서 글자를 읽지 못했습니다."});
  }finally{ if(worker) await worker.terminate().catch(()=>{}); if(활성OCR===worker)활성OCR=null; }
}

// 열쇳말로 문서 종류를 맞춘다. 점수가 낮으면 맞혔다고 하지 않는다.
function 판독(글){
  const 납작 = 글.replace(/\s+/g,"");
  let 최고=null, 최고점=0;
  for(const d of D.문서판별){
    let 점수=0;
    for(const [말,w] of d.열쇳말) if(납작.includes(말.replace(/\s+/g,""))) 점수+=w;
    if(점수>최고점){ 최고점=점수; 최고=d.이름; }
  }
  const 번호 = 번호읽기(글);
  const 비형사 = 부호RE.exec(글);
  const 범위밖 = !!(비형사 && D.비형사[비형사[2]]);
  const 제목들 = D.문서판별.filter(d=>납작.includes(d.이름)).map(d=>d.이름);
  const 모호함 = 제목들.length>1;
  // 사건번호는 제목보다 훨씬 정확히 읽힌다. 부호가 문서 종류를 말해주면 그쪽을 믿는다.
  const 부호짐작 = (번호.ok && D.부호로문서[번호.부호]) || null;
  if(부호짐작){
    if(부호짐작===최고) 최고점 += 8;      // 두 신호가 맞으면 확신
    else if(최고점 < 10){ 최고 = 부호짐작; 최고점 = 10; }  // 제목이 약하면 번호를 따른다
  }
  return {
    문서: !범위밖 && !모호함 && 최고점>=6 ? 최고 : null,
    범위밖, 모호함,
    점수: 최고점,
    번호: 번호.ok ? 번호 : null,
    근거: 부호짐작 ? "사건번호와 본문" : "본문",
    원문: 글.slice(0,20000),
  };
}

    ${nav()}`;
  종류.forEach((k,i)=>{ app.querySelector(`[data-k="${i}"]`).onclick=()=>문서선택(k, r.번호); });

function 문서선택(이름, 번호){
  const v = D.문서종류표[이름];
  if(!v || !v.진입노드){ 그리기(D.첫질문,true); return; }
  // 판결문이라는 제목만으로 민사/형사와 심급을 정할 수 없다.
  if(이름==="판결문"){ 확인보류(); return; }
  // 문서에 적힌 날짜를 기산점으로 쓸 수 있는 경우는 판결문뿐이다.
  // 나머지는 '만든 날'이라 반드시 받은 날을 따로 묻는다 (설계도 7-2).
  if(v.날짜사용==="물어봐야함" || v.날짜사용==="문서날짜"){
    날짜묻기(이름, v);
    return;
  }
  이동(v.진입노드);

function 날짜묻기(이름, v){
